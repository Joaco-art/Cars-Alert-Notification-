<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Index</title>
    <link rel="stylesheet" href="/css/main.css">

</head>
<main>
    <h1>Hola mundo</h1>
    <div class="form-container">
        <h2>Vehicle Registration</h2>
        <form action="carAlert" method="POST">
            <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="username" placeholder="e.g. John Doe" required>
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="e.g. mail@example.com" required>
                </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="brand">Brand</label>
                    <select id="brand" name="brand" required>
                        <option value="">Select a brand</option>
                        <option value="toyota">Toyota</option>
                        <option value="volkswagen">Volkswagen</option>
                        <option value="ford">Ford</option>
                        <option value="chevrolet">Chevrolet</option>
                        <option value="honda">Honda</option>
                        <option value="nissan">Nissan</option>
                        <option value="hyundai">Hyundai</option>
                        <option value="kia">Kia</option>
                        <option value="bmw">BMW</option>
                        <option value="mercedes">Mercedes-Benz</option>
                        <option value="audi">Audi</option>
                        <option value="tesla">Tesla</option>
                        <option value="subaru">Subaru</option>
                        <option value="mazda">Mazda</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="model">Model</label>
                    <input type="text" id="model" name="model" placeholder="e.g. Corolla, Civic, Focus..." required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="year">Year</label>
                    <input type="number" id="year" name="year" min="1900" max="2026" placeholder="e.g. 2023" required>
                </div>

                <div class="form-group">
                    <label for="fuel_type">Fuel Type</label>
                    <select id="fuel_type" name="fuel_type" required>
                        <option value="">Select fuel type</option>
                        <option value="gasoline">Gasoline</option>
                        <option value="diesel">Diesel</option>
                        <option value="hybrid">Hybrid</option>
                        <option value="electric">Electric</option>
                        <option value="lpg">LPG / CNG</option>
                    </select>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="price">Price less than (EUR)</label>
                    <input type="price" id="price" name="price" min="0" placeholder="e.g. 2023" required>
                </div>

                <div class="form-group">
                    <label for="km">Km less than</label>
                    <input type="number" id="km" name="km" min="0" placeholder="e.g. 2023" required>
                </div>

            </div>
            <button type="submit" class="form-submit">Save Vehicle</button>


        </form>
    </div>
</main>
</html>
