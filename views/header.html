<header class="sticky top-0 z-30 bg-white border-b border-slate-200 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex flex-wrap items-center justify-between gap-4 py-3.5">
                <a href="/" class="flex items-center gap-2.5 text-lg font-bold tracking-tight text-slate-900">
                    <span class="inline-flex h-8 w-8 items-center justify-center rounded-lg bg-blue-600 text-white text-sm font-semibold">CA</span>
                    <span>CarsAlert</span>
                </a>

                <nav class="hidden md:flex items-center gap-6 text-sm font-medium text-slate-600">
                    <a href="/" class="hover:text-slate-900 transition-colors">Home</a>
                    <a href="#registro" class="text-blue-600 font-semibold">Create alert</a>
                </nav>

                <form action="/search" method="GET" class="w-full sm:w-auto flex-1 max-w-md">
                    <label for="navbar-search" class="sr-only">Search vehicle</label>
                    <div class="relative flex items-center">
                        <input
                            type="search"
                            id="navbar-search"
                            name="q"
                            placeholder="Search make, model, or year..."
                            class="w-full rounded-lg border border-slate-300 bg-slate-50 py-2 pl-3.5 pr-20 text-sm text-slate-900 placeholder-slate-400 focus:border-blue-600 focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-600/20"
                        >
                        <button
                            type="submit"
                            class="absolute right-1.5 rounded-md bg-slate-900 px-3 py-1 text-xs font-medium text-white hover:bg-slate-800 transition-colors cursor-pointer"
                        >
                            Search
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </header>
