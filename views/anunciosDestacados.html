<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
    {{#cars}}
    <article
        class="group overflow-hidden rounded-2xl border border-slate-200/90 bg-white shadow-sm hover:shadow-md hover:border-slate-300 transition-all duration-300 flex flex-col justify-between">
        <div>
            <!-- Vehicle Image with Fallback -->
            <div class="relative aspect-[16/10] w-full overflow-hidden bg-slate-100">
                <img src="{{#image}}{{image}}{{/image}}{{^image}}https://images.unsplash.com/photo-1555215695-3004980ad54e?auto=format&fit=crop&w=800&q=80{{/image}}"
                    alt="{{brand}} {{model}}" loading="lazy"
                    class="h-full w-full object-cover object-center group-hover:scale-105 transition-transform duration-500 ease-out" />
                <span
                    class="absolute top-3 right-3 inline-flex items-center rounded-lg bg-slate-900/75 backdrop-blur-xs px-2.5 py-1 text-xs font-semibold text-white">
                    {{year}}
                </span>
            </div>

            <!-- Card Body -->
            <div class="p-6 pb-0">
                <div class="mb-2">
                    <span
                        class="inline-flex items-center rounded-md bg-blue-50 px-2.5 py-0.5 text-xs font-bold uppercase tracking-wider text-blue-700 border border-blue-100">
                        {{brand}}
                    </span>
                </div>

                <h3 class="text-lg font-extrabold text-slate-900 group-hover:text-blue-600 transition-colors">
                    {{model}}
                </h3>
                <div class="mt-2 flex items-baseline gap-1">
                    <p class="text-2xl font-extrabold tracking-tight text-slate-900">{{price}} €</p>
                
                </div>

                

                <dl class="mt-5 pt-4 border-t border-slate-100 grid grid-cols-2 gap-3 text-xs">
                    <div class="rounded-lg bg-slate-50 px-3 py-2">
                        <dt class="text-[11px] font-medium text-slate-400 uppercase tracking-wider">Mileage</dt>
                        <dd class="mt-0.5 font-semibold text-slate-800">{{km}} km</dd>
                    </div>
                    <div class="rounded-lg bg-slate-50 px-3 py-2">
                        <dt class="text-[11px] font-medium text-slate-400 uppercase tracking-wider">Power</dt>
                        <dd class="mt-0.5 font-semibold text-slate-800">{{hp}} HP</dd>
                    </div>
                    <div class="rounded-lg bg-slate-50 px-3 py-2">
                        <dt class="text-[11px] font-medium text-slate-400 uppercase tracking-wider">Fuel</dt>
                        <dd class="mt-0.5 font-semibold text-slate-800">{{fuel}}</dd>
                    </div>
                    <div class="rounded-lg bg-slate-50 px-3 py-2">
                        <dt class="text-[11px] font-medium text-slate-400 uppercase tracking-wider">Transmission</dt>
                        <dd class="mt-0.5 font-semibold text-slate-800">{{gearbox}}</dd>
                    </div>
                </dl>
            </div>
        </div>

        <!-- Card Footer -->
        <div class="p-6 pt-5">
            {{#link}}
            <a href="{{link}}" target="_blank" rel="noopener noreferrer"
                class="w-full inline-flex items-center justify-center gap-2 rounded-xl bg-slate-900 px-4 py-2.5 text-xs font-semibold text-white shadow-sm hover:bg-blue-600 transition-all duration-200">
                <span>View listing</span>
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" />
                </svg>
            </a>
            {{/link}}
        </div>
    </article>
    {{/cars}}
</div>
