<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Info — CarsAlert</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen flex flex-col bg-slate-50 text-slate-900 antialiased">
{{> header}}
    <main class="flex-1 max-w-4xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-12">
        <div class="result-container rounded-2xl border border-slate-200 bg-white shadow-sm overflow-hidden">
            <!-- Cabecera de confirmación -->
            <div class="border-b border-slate-100 bg-emerald-50/60 px-6 sm:px-8 py-6">
                <span class="inline-flex items-center rounded-full bg-emerald-100 px-3 py-1 text-xs font-semibold text-emerald-800">
                    Alert saved
                </span>
                <h2 class="mt-3 text-2xl font-bold tracking-tight text-slate-900">
                    Data has been sent successfully
                </h2>
                <h3 class="subtitle mt-1 text-sm font-medium text-slate-600">
                    Information saved:
                </h3>
            </div>

            <!-- Cuadrícula de datos guardados -->
            <div class="p-6 sm:p-8">
                <div class="data-grid grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div class="data-item rounded-xl border border-slate-200/80 bg-slate-50/70 p-4">
                        <div class="data-label text-xs font-semibold uppercase tracking-wider text-slate-400">Name</div>
                        <div class="data-value mt-1 text-base font-semibold text-slate-900 break-words">{{name}}</div>
                    </div>

                    <div class="data-item rounded-xl border border-slate-200/80 bg-slate-50/70 p-4">
                        <div class="data-label text-xs font-semibold uppercase tracking-wider text-slate-400">Email</div>
                        <div class="data-value mt-1 text-base font-semibold text-slate-900 break-all">{{email}}</div>
                    </div>

                    <div class="data-item rounded-xl border border-slate-200/80 bg-slate-50/70 p-4">
                        <div class="data-label text-xs font-semibold uppercase tracking-wider text-slate-400">Brand</div>
                        <div class="data-value mt-1 text-base font-semibold text-slate-900 capitalize">{{brand}}</div>
                    </div>

                    <div class="data-item rounded-xl border border-slate-200/80 bg-slate-50/70 p-4">
                        <div class="data-label text-xs font-semibold uppercase tracking-wider text-slate-400">Model</div>
                        <div class="data-value mt-1 text-base font-semibold text-slate-900">{{model}}</div>
                    </div>

                    <div class="data-item rounded-xl border border-slate-200/80 bg-slate-50/70 p-4">
                        <div class="data-label text-xs font-semibold uppercase tracking-wider text-slate-400">Year</div>
                        <div class="data-value mt-1 text-base font-semibold text-slate-900">{{year}}</div>
                    </div>

                    <div class="data-item rounded-xl border border-slate-200/80 bg-slate-50/70 p-4">
                        <div class="data-label text-xs font-semibold uppercase tracking-wider text-slate-400">Fuel</div>
                        <div class="data-value mt-1 text-base font-semibold text-slate-900 capitalize">{{fuel}}</div>
                    </div>

                    <div class="data-item rounded-xl border border-slate-200/80 bg-slate-50/70 p-4">
                        <div class="data-label text-xs font-semibold uppercase tracking-wider text-slate-400">Price</div>
                        <div class="data-value mt-1 text-base font-bold text-blue-600">{{price}} EUR</div>
                    </div>

                    <div class="data-item rounded-xl border border-slate-200/80 bg-slate-50/70 p-4">
                        <div class="data-label text-xs font-semibold uppercase tracking-wider text-slate-400">Km</div>
                        <div class="data-value mt-1 text-base font-semibold text-slate-900">{{km}} km</div>
                    </div>
                    <div class="data-item rounded-xl border border-slate-200/80 bg-slate-50/70 p-4">
                        <div class="data-label text-xs font-semibold uppercase tracking-wider text-slate-400">Condition</div>
                        <div class="data-value mt-1 text-base font-semibold text-slate-900">{{condition}}</div>
                    </div>
                    <div class="data-item rounded-xl border border-slate-200/80 bg-slate-50/70 p-4">
                        <div class="data-label text-xs font-semibold uppercase tracking-wider text-slate-400">Has any accident</div>
                        <div class="data-value mt-1 text-base font-semibold text-slate-900">{{hasAccident}}</div>
                    </div>
                </div>

                <!-- Acción de regreso -->
                <div class="mt-8 pt-6 border-t border-slate-100 flex justify-end">
                    <a
                        href="/"
                        class="form-submit inline-flex items-center justify-center rounded-xl bg-blue-600 px-6 py-2.5 text-sm font-semibold text-white shadow-sm hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-600 focus:ring-offset-2 transition-colors"
                    >
                        Back
                    </a>
                </div>
            </div>
        </div>
    </main>
{{> footer}}
</body>
</html>
