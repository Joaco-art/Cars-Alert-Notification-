<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Info</title>
    <link rel="stylesheet" href="/css/result.css">
</head>
<main>
   <div class="result-container">
        <h2>Data has been sent successfully</h2>
        <h2 class="subtitle">Information saved:</h2>
        
        <div class="data-grid">
            <div class="data-item">
                <div class="data-label">Name</div>
                <div class="data-value">{{name}}</div>
            </div>
            <div class="data-item">
                <div class="data-label">Email</div>
                <div class="data-value">{{email}}</div>
            </div>
            <div class="data-item">
                <div class="data-label">Brand</div>
                <div class="data-value">{{brand}}</div>
            </div>
            <div class="data-item">
                <div class="data-label">Model</div>
                <div class="data-value">{{model}}</div>
            </div>
            <div class="data-item">
                <div class="data-label">Year</div>
                <div class="data-value">{{year}}</div>
            </div>
            <div class="data-item">
                <div class="data-label">Fuel</div>
                <div class="data-value">{{fuel}}</div>
            </div>
            <div class="data-item">
                <div class="data-label">Price</div>
                <div class="data-value">{{price}} EUR</div>
            </div>
            <div class="data-item">
                <div class="data-label">Km</div>
                <div class="data-value">{{km}} km</div>
            </div>
        </div>
    </div>
    <button class="form-submit"><a href="/">Back</a></button>
    
</main>
</html>
